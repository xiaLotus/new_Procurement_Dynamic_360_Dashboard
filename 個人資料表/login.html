<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 · 部門通訊錄</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6F6;
    --surface:#FFFFFF;
    --ink:#17262E;
    --muted:#61737C;
    --line:#E1E8E8;
    --accent:#0B6E6E;
    --accent-soft:#E2F0EE;
    --danger:#DC2626;
    --danger-soft:#FEF2F2;
  }
  html,body{height:100%}
  body{
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    background-color:var(--bg);
    background-image:radial-gradient(#DDE6E6 1px, transparent 1px);
    background-size:22px 22px;
  }
  .mono{font-family:"IBM Plex Mono","Consolas",monospace}

  /* ---------- 版面 ---------- */
  .stage{min-height:100%;display:grid;grid-template-columns:1fr}
  @media (min-width:900px){.stage{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}

  /* ---------- 左側：自動化線路 ---------- */
  .hero{
    position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(160deg,#0E7B7B 0%,#0B6E6E 42%,#07474B 100%);
    padding:36px 28px;min-height:230px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  @media (min-width:900px){.hero{padding:56px}}
  .hero .net{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .hero-glow{
    position:absolute;width:560px;height:560px;border-radius:9999px;pointer-events:none;
    top:-180px;right:-160px;
    background:radial-gradient(circle, rgba(255,255,255,.16), transparent 62%);
  }
  .hero-top,.hero-bottom{position:relative;z-index:1}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
    border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.10);
    font-size:12px;backdrop-filter:blur(4px);
  }
  .chip::before{content:"";width:6px;height:6px;border-radius:9999px;background:#fff;opacity:.8}

  /* ---------- 右側：登入卡 ---------- */
  .panel{display:flex;align-items:center;justify-content:center;padding:32px 20px}
  @media (min-width:900px){.panel{padding:48px}}
  .card{
    width:100%;max-width:420px;position:relative;overflow:hidden;
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:36px 32px;
    box-shadow:0 20px 50px rgba(11,110,110,.10), 0 1px 2px rgba(23,38,46,.05);
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .fx{opacity:0}

  .lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .ipt{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:14px;background:#FBFDFD;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .ipt:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,110,110,.12);background:#fff}
  .ipt-wrap{position:relative}
  .ipt-wrap .ipt{padding-left:40px}
  .ipt-wrap.has-eye .ipt{padding-right:46px}
  .ipt-wrap .ico{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--muted);pointer-events:none;transition:color .15s;
  }
  .ipt-wrap:focus-within .ico{color:var(--accent)}
  .eye{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border-radius:8px;color:var(--muted);
    display:flex;align-items:center;justify-content:center;transition:background .15s, color .15s;
  }
  .eye:hover{background:var(--accent-soft);color:var(--accent)}
  .eye:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .eye svg{width:16px;height:16px}

  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

  .btn-accent{
    width:100%;background:var(--accent);color:#fff;border-radius:10px;
    padding:11px 20px;font-size:14px;font-weight:500;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:opacity .15s, transform .1s, box-shadow .15s;
  }
  .btn-accent:hover:not(:disabled){opacity:.92;box-shadow:0 8px 20px rgba(11,110,110,.22)}
  .btn-accent:active:not(:disabled){transform:scale(.985)}
  .btn-accent:disabled{opacity:.55;cursor:not-allowed}
  .btn-accent:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .spin{
    width:16px;height:16px;border-radius:9999px;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .alert{
    display:none;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;
    font-size:13px;line-height:1.5;background:var(--danger-soft);color:#B91C1C;border:1px solid #FECACA;
  }
  .alert.show{display:flex}
  .alert svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
  .hint{font-size:12px;color:var(--muted);min-height:18px}

  @media (prefers-reduced-motion:reduce){
    .fx{opacity:1}
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="stage">

  <!-- ==================== 左側：主視覺 ==================== -->
  <aside class="hero">
    <div class="hero-glow"></div>

    <!-- 自動化線路：線路先描繪、節點亮起、訊號沿線流動 -->
    <svg class="net" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.5">
        <path class="edge" d="M80 120 L240 80"/>
        <path class="edge" d="M240 80 L420 150"/>
        <path class="edge" d="M420 150 L540 60"/>
        <path class="edge" d="M80 120 L140 300"/>
        <path class="edge" d="M240 80 L330 320"/>
        <path class="edge" d="M420 150 L500 280"/>
        <path class="edge" d="M140 300 L330 320"/>
        <path class="edge" d="M330 320 L500 280"/>
        <path class="edge" d="M140 300 L90 480"/>
        <path class="edge" d="M330 320 L260 520"/>
        <path class="edge" d="M500 280 L440 470"/>
        <path class="edge" d="M90 480 L260 520"/>
        <path class="edge" d="M260 520 L440 470"/>
        <path class="edge" d="M90 480 L170 680"/>
        <path class="edge" d="M260 520 L380 700"/>
        <path class="edge" d="M440 470 L540 640"/>
        <path class="edge" d="M170 680 L380 700"/>
        <path class="edge" d="M380 700 L540 640"/>
      </g>
      <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85">
        <path class="pulse" d="M80 120 L240 80 L330 320 L260 520 L380 700"/>
        <path class="pulse" d="M540 60 L420 150 L500 280 L440 470 L540 640"/>
        <path class="pulse" d="M140 300 L330 320 L500 280"/>
        <path class="pulse" d="M90 480 L260 520 L440 470"/>
      </g>
      <g fill="rgba(255,255,255,.8)">
        <circle class="node" cx="80"  cy="120" r="5"/>
        <circle class="node" cx="240" cy="80"  r="5"/>
        <circle class="node" cx="420" cy="150" r="5"/>
        <circle class="node" cx="540" cy="60"  r="5"/>
        <circle class="node" cx="140" cy="300" r="5"/>
        <circle class="node" cx="330" cy="320" r="5"/>
        <circle class="node" cx="500" cy="280" r="5"/>
        <circle class="node" cx="90"  cy="480" r="5"/>
        <circle class="node" cx="260" cy="520" r="5"/>
        <circle class="node" cx="440" cy="470" r="5"/>
        <circle class="node" cx="170" cy="680" r="5"/>
        <circle class="node" cx="380" cy="700" r="5"/>
        <circle class="node" cx="540" cy="640" r="5"/>
      </g>
    </svg>

    <div class="hero-top">
      <div class="mono text-[11px] tracking-[0.22em] font-medium opacity-80 fx">STAFF DIRECTORY</div>
      <h1 class="text-3xl md:text-4xl font-bold mt-2 fx">部門通訊錄</h1>
      <p class="mt-3 text-sm md:text-[15px] opacity-90 max-w-sm leading-relaxed fx">
        人員名牌、聯絡方式與學經歷集中管理，修改後即時自動儲存。
      </p>
    </div>

    <div class="hero-bottom hidden md:flex flex-wrap gap-2">
      <span class="chip fx">名牌卡片檢視</span>
      <span class="chip fx">自動儲存</span>
      <span class="chip fx">照片裁切上傳</span>
    </div>
  </aside>

  <!-- ==================== 右側：登入表單 ==================== -->
  <main class="panel">
    <form id="loginForm" class="card" novalidate>
      <div class="mono text-[11px] tracking-[0.22em] text-[var(--accent)] font-medium fx">SIGN IN</div>
      <h2 class="text-2xl font-bold mt-1 fx">登入通訊錄</h2>
      <p class="text-sm text-[var(--muted)] mt-1 mb-6 fx">請以通訊錄內已建檔的工號登入</p>

      <div id="alert" class="alert mb-4" role="alert" aria-live="polite">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01" stroke-linecap="round"/>
        </svg>
        <span id="alertText"></span>
      </div>

      <label class="block mb-4 fx">
        <span class="lbl">工號</span>
        <div class="ipt-wrap">
          <svg class="ico" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke-linecap="round"/>
          </svg>
          <input id="username" class="ipt" type="text" placeholder="例：K18251"
                 autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </div>
      </label>

      <label class="block mb-1 fx">
        <span class="lbl">密碼</span>
        <div class="ipt-wrap has-eye">
          <svg class="ico" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke-linecap="round"/>
          </svg>
          <input id="password" class="ipt mono" type="password" placeholder="••••••••"
                 autocomplete="current-password" required>
          <button type="button" id="eye" class="eye" aria-label="顯示或隱藏密碼" title="顯示 / 隱藏密碼">
            <svg id="eyeShow" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeHide" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" hidden>
              <path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2M6.6 6.7C4 8.3 2 12 2 12s3.5 6 10 6c1.7 0 3.2-.4 4.5-1M9.9 5.2C10.6 5.1 11.3 5 12 5c6.5 0 10 7 10 7s-.8 1.6-2.4 3.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </label>
      <div id="capsHint" class="hint mb-3 fx" aria-live="polite"></div>

      <label class="flex items-center gap-2 text-sm mb-6 select-none cursor-pointer fx">
        <input id="remember" type="checkbox">
        <span>保持登入 30 天</span>
      </label>

      <button id="submitBtn" type="submit" class="btn-accent fx">
        <span id="btnLabel">登入</span>
        <span id="btnSpin" class="spin hidden"></span>
      </button>

      <p class="text-xs text-[var(--muted)] text-center mt-6 fx">內部系統，僅供授權人員使用</p>
    </form>
  </main>
</div>

<script>
(() => {
  const API_BASE = location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:5000';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canAnimate = typeof anime !== 'undefined' && !reducedMotion;

  const $ = id => document.getElementById(id);
  const form = $('loginForm');
  const username = $('username');
  const password = $('password');
  const remember = $('remember');
  const submitBtn = $('submitBtn');
  const btnLabel = $('btnLabel');
  const btnSpin = $('btnSpin');
  const alertBox = $('alert');
  const alertText = $('alertText');
  const capsHint = $('capsHint');
  const eye = $('eye');
  const eyeShow = $('eyeShow');
  const eyeHide = $('eyeHide');

  // 已有有效 token（例如勾過「保持登入」）就直接進主頁，跳轉一律用前端 window.location，
  // 用 file:// 開啟時網址會保持 file:///D:/... 的形式
  (async () => {
    const token = localStorage.getItem('authToken');
    if (!token) return;
    try {
      const response = await fetch(`${API_BASE}/api/me`, {
        credentials: 'include',
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (response.ok) {
        window.location.replace('index.html');
      } else {
        localStorage.removeItem('authToken');
      }
    } catch (error) {}
  })();

  // ---------- 進場：線路描繪 → 節點亮起 → 訊號流動 → 文字與表單浮現 ----------
  if (!canAnimate) {
    document.querySelectorAll('.fx').forEach(element => { element.style.opacity = 1; });
  } else {
    anime({
      targets: '.edge',
      strokeDashoffset: [anime.setDashoffset, 0],
      easing: 'easeInOutSine',
      duration: 1100,
      delay: anime.stagger(45),
    });

    anime({
      targets: '.node',
      r: [0, 5],
      opacity: [0, 1],
      easing: 'easeOutBack',
      duration: 650,
      delay: anime.stagger(50, { start: 450 }),
      complete: () => anime({
        targets: '.node',
        r: [5, 6.5],
        direction: 'alternate',
        loop: true,
        easing: 'easeInOutSine',
        duration: 1500,
        delay: anime.stagger(140),
      }),
    });

    document.querySelectorAll('.pulse').forEach((path, index) => {
      const length = path.getTotalLength();
      const dash = 18;
      path.setAttribute('stroke-dasharray', `${dash} ${length}`);
      path.setAttribute('stroke-dashoffset', length + dash);
      anime({
        targets: path,
        strokeDashoffset: [length + dash, dash],
        easing: 'linear',
        duration: 1600 + length * 2.4,
        delay: 1300 + index * 650,
        endDelay: 900,
        loop: true,
      });
    });

    anime.timeline({ easing: 'easeOutCubic' })
      .add({ targets: '.hero .fx', translateY: [14, 0], opacity: [0, 1], duration: 650, delay: anime.stagger(80) }, 150)
      .add({ targets: '.card .fx', translateY: [16, 0], opacity: [0, 1], duration: 600, delay: anime.stagger(55) }, 350);
  }

  // ---------- 狀態與回饋 ----------
  function setLoading(on) {
    submitBtn.disabled = on;
    btnSpin.classList.toggle('hidden', !on);
    btnLabel.textContent = on ? '登入中…' : '登入';
  }

  function showAlert(message) {
    alertText.textContent = message;
    alertBox.classList.add('show');
    if (canAnimate) {
      anime({ targets: alertBox, opacity: [0, 1], translateY: [-6, 0], duration: 280, easing: 'easeOutCubic' });
    }
  }

  function hideAlert() {
    alertBox.classList.remove('show');
  }

  function shake() {
    if (!canAnimate) return;
    anime({
      targets: form,
      translateX: [0, -9, 9, -7, 7, -4, 4, 0],
      duration: 480,
      easing: 'easeInOutSine',
    });
  }

  // ---------- 送出 ----------
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (submitBtn.disabled) return;

    const user = username.value.trim();
    const pwd = password.value;
    if (!user || !pwd) {
      showAlert('請輸入工號與密碼');
      shake();
      (user ? password : username).focus();
      return;
    }

    hideAlert();
    setLoading(true);
    try {
      const response = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pwd, remember: remember.checked }),
      });
      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        showAlert(result.error || '登入失敗');
        shake();
        setLoading(false);
        password.select();
        return;
      }

      // 成功：存下 token，按鈕顯示歡迎字樣，卡片淡出後用前端跳轉到同資料夾的 index.html
      if (result.token) localStorage.setItem('authToken', result.token);
      btnSpin.classList.add('hidden');
      btnLabel.textContent = `歡迎，${(result.user && result.user.name) || user}`;
      const go = () => window.location.replace('index.html');
      if (canAnimate) {
        anime({
          targets: form,
          opacity: 0,
          translateY: -12,
          scale: 0.98,
          duration: 380,
          delay: 420,
          easing: 'easeInCubic',
          complete: go,
        });
      } else {
        go();
      }
    } catch (error) {
      showAlert('無法連線後端 API，請確認 app.py 已啟動');
      shake();
      setLoading(false);
    }
  });

  // ---------- 密碼顯示切換與 Caps Lock 提示 ----------
  eye.addEventListener('click', () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    eyeShow.hidden = show;
    eyeHide.hidden = !show;
    password.focus();
  });

  const checkCaps = event => {
    const on = typeof event.getModifierState === 'function' && event.getModifierState('CapsLock');
    capsHint.textContent = on ? 'Caps Lock 已開啟' : '';
  };
  password.addEventListener('keydown', checkCaps);
  password.addEventListener('keyup', checkCaps);
  password.addEventListener('blur', () => { capsHint.textContent = ''; });

  [username, password].forEach(element => element.addEventListener('input', hideAlert));

  setTimeout(() => username.focus(), canAnimate ? 550 : 0);
})();
</script>
</body>
</html>
