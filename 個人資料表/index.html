<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Chip CIM 人員介紹</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          steel: { DEFAULT:'#2C5C8F', dark:'#1E4266' },
          copper: '#B4652A',
          desk: '#3A4450',
        },
        fontFamily: {
          sans: ['"Noto Sans TC"', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        },
      }
    }
  }
</script>

<style>
  /* Tailwind 無法處理的部分:紙張列印尺寸與 @page,其餘一律用 Tailwind class */
  @page { size: A3 landscape; margin: 0; }
  @media print {
    .sheet { width: 420mm !important; height: 297mm !important; padding: 12mm 14mm !important; box-shadow:none !important; }
    .sheet-gap { gap: 5mm !important; }
  }
  input[type="date"]::-webkit-calendar-picker-indicator{ opacity:.6 }
</style>
</head>

<body class="bg-desk font-sans text-slate-800">
<div id="app"></div>

<script type="text/x-template" id="tpl-app">
  <div>
    <!-- 浮動提示 -->
    <transition enter-active-class="transition duration-200 ease-out" enter-from-class="opacity-0 -translate-y-2" leave-active-class="transition duration-200 ease-in" leave-to-class="opacity-0 -translate-y-2">
      <div v-if="message"
           class="fixed top-4 left-1/2 -translate-x-1/2 z-50 rounded-full px-6 py-2 text-sm font-bold text-white shadow-lg print:hidden"
           :class="isError ? 'bg-red-800' : 'bg-steel-dark'">
        {{ message }}
      </div>
    </transition>

    <!-- ============ 首頁:通訊錄 ============ -->
    <div v-if="view === 'home'" class="w-full px-8 py-8 pb-6 h-screen flex flex-col">
      <div class="w-4/5 mx-auto flex-1 min-h-0 flex flex-col">

        <div class="flex flex-wrap items-center gap-4 mb-5 flex-none">
          <div>
            <h1 class="text-white text-xl font-black tracking-[.3em]">通訊錄</h1>
            <p class="text-copper font-mono text-xs tracking-widest mt-1">TOTAL {{ filteredList.length }} / {{ list.length }}</p>
          </div>
          <input v-model.trim="keyword" placeholder="搜尋工號 / 姓名 / 電話…"
                 class="ml-auto w-64 rounded-lg border-0 px-4 py-2.5 text-sm bg-white/95 shadow focus:ring-2 focus:ring-copper outline-none">
          <button @click="newPerson"
                  class="rounded-lg bg-copper hover:brightness-110 text-white text-sm font-bold px-5 py-2.5 shadow transition">
            + 新增人員
          </button>
        </div>

        <!-- 欄數依畫面寬度自動調整(1~3 欄),超出的資料交給下方分頁 -->
        <div ref="colArea" class="grid gap-5 flex-1 min-h-0" :style="{ gridTemplateColumns: 'repeat(' + numColumns + ', minmax(0,1fr))' }">
          <div v-for="ci in numColumns" :key="ci"
               class="bg-white rounded-xl shadow-lg overflow-hidden ring-1 ring-slate-200 flex flex-col">
            <div class="grid grid-cols-[64px_72px_1fr] gap-3 bg-gradient-to-r from-steel-dark to-steel text-white text-[11px] font-bold tracking-[.18em] flex-none">
              <div class="px-3 py-3 flex items-center gap-1.5 whitespace-nowrap">
                <span class="opacity-60">#</span>工號
              </div>
              <div class="px-1 py-3 whitespace-nowrap">姓名</div>
              <div class="px-3 py-3 flex items-center gap-1.5 whitespace-nowrap">
                <svg class="w-3 h-3 opacity-70 flex-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                行動電話
              </div>
            </div>
            <div class="divide-y divide-slate-100 overflow-hidden">
              <div v-for="p in pagedColumns[ci-1]" :key="p.empNo" @click="openPerson(p.empNo)"
                   class="grid grid-cols-[64px_72px_1fr] gap-3 items-center px-3 py-2.5 cursor-pointer hover:bg-sky-50 transition">
                <div class="font-mono text-[11px] text-slate-400 truncate">{{ p.empNo }}</div>
                <div class="min-w-0 font-bold text-steel-dark text-sm truncate">{{ p.nameZh || '(未填姓名)' }}</div>
                <div class="font-mono text-sm font-semibold text-steel-dark truncate">{{ p.mobile || '—' }}</div>
              </div>
              <div v-if="!pagedColumns[ci-1].length" class="px-3 py-6 text-center text-slate-300 text-xs">—</div>
            </div>
          </div>
        </div>

        <div v-if="!filteredList.length" class="flex-1 min-h-0 flex items-center justify-center bg-white/10 border border-dashed border-white/30 rounded-xl text-center text-white/70 leading-loose -mt-[calc(1rem+34px)]">
          {{ list.length ? '找不到符合「' + keyword + '」的人員' : '目前尚無資料,點右上「+ 新增人員」建立第一筆個人介紹表' }}
        </div>

        <!-- 分頁列:高度固定預留,無論是否有多頁都佔住底部空間 -->
        <div class="flex-none h-12 flex items-center justify-center gap-4">
          <template v-if="totalPages > 1">
            <button @click="prevPage" :disabled="page===0"
                    class="px-4 py-1.5 rounded-md bg-white/10 text-white text-xs font-bold hover:bg-white/20 disabled:opacity-30 disabled:cursor-not-allowed transition">
              ‹ 上一頁
            </button>
            <span class="font-mono text-xs tracking-widest text-copper">第 {{ page + 1 }} / {{ totalPages }} 頁 · 每頁 {{ perPage }} 筆</span>
            <button @click="nextPage" :disabled="page >= totalPages - 1"
                    class="px-4 py-1.5 rounded-md bg-white/10 text-white text-xs font-bold hover:bg-white/20 disabled:opacity-30 disabled:cursor-not-allowed transition">
              下一頁 ›
            </button>
          </template>
        </div>

      </div>
    </div>

    <!-- ============ 詳細頁:A3 個人介紹表 ============ -->
    <div v-else class="flex justify-center px-4 py-6">
      <div class="sheet w-full max-w-[1500px] bg-white shadow-2xl px-6 py-4 flex flex-col gap-2 sheet-gap">

        <!-- 紙內操作列 -->
        <div class="flex items-center gap-3 pb-2 border-b border-slate-200 print:hidden">
          <button @click="goHome"
                  class="rounded-md border border-slate-300 text-steel-dark text-xs font-bold px-4 py-1.5 hover:bg-slate-50 transition mr-auto">
            ← 返回名單
          </button>
          <button v-if="!editing" @click="editing = true"
                  class="rounded-md bg-steel text-white text-xs font-bold px-5 py-1.5 hover:brightness-110 transition">
            編輯
          </button>
          <button v-else @click="finishEdit"
                  class="rounded-md bg-copper text-white text-xs font-bold px-5 py-1.5 hover:brightness-110 transition">
            完成
          </button>
        </div>

        <!-- 表頭 -->
        <header class="flex items-center gap-5 pb-2 border-b-[3px] border-steel">
          <div class="grid grid-cols-4 gap-1" aria-hidden="true">
            <i v-for="n in 16" :key="n" class="w-[5px] h-[5px] rounded-full"
               :class="n % 2 ? 'bg-steel' : 'bg-copper'"></i>
          </div>
          <div class="flex-1">
            <h1 class="text-[19px] font-black tracking-wider text-steel-dark">Flip Chip CIM 個人介紹表</h1>
            <div class="font-mono text-[9px] tracking-[.2em] text-copper uppercase mt-0.5">
              Flip Chip CIM · Personal Introduction Sheet · A3 Landscape
            </div>
          </div>
          <div class="text-right font-mono text-[9px] text-slate-500 leading-relaxed border-l border-slate-300 pl-4">
            DOC NO. <b class="text-steel-dark">FC-CIM-HR-001</b><br>
            REV. <b class="text-steel-dark">A</b> &nbsp; PAGE <b class="text-steel-dark">1 / 1</b><br>
            FORMAT <b class="text-steel-dark">A3 橫式(上橫排)</b>
          </div>
          <div class="flex-none text-center">
            <div class="relative w-[78px] h-[98px] border border-slate-300 bg-slate-50 flex items-center justify-center overflow-hidden">
              <img v-if="photoSrc" :src="photoSrc" class="w-full h-full object-cover">
              <span v-else class="text-[9px] text-slate-400 px-1 leading-relaxed">
                {{ editing ? '點擊上傳照片' : '尚無照片' }}<br>(2 吋,jpg/png)
              </span>
              <input v-if="editing" type="file" accept="image/*" @change="onPhotoChange"
                     class="absolute inset-0 opacity-0 cursor-pointer print:hidden">
            </div>
            <div class="text-[8px] text-slate-400 tracking-[.2em] mt-0.5">PHOTO</div>
          </div>
        </header>

        <!-- SEC.01 基本資料 -->
        <section>
          <div class="flex items-center gap-2">
            <span class="font-mono text-[9px] text-copper tracking-wide">SEC.01</span>
            <h2 class="text-[13px] font-black tracking-[.25em] text-steel-dark">基本資料</h2>
            <div class="flex-1 h-px bg-gradient-to-r from-steel via-slate-200 to-transparent"></div>
          </div>

          <div class="mt-1.5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 border-t border-l border-slate-300">
            <template v-for="f in basicFields" :key="f.key">
              <div class="flex border-r border-b border-slate-300 min-h-[30px]">
                <label class="flex-none w-[92px] flex items-center justify-center text-center bg-slate-50 text-steel-dark text-[11px] font-bold px-2">{{ f.label }}</label>
                <div class="flex-1 flex">
                  <select v-if="f.type==='select'" v-model="form[f.key]" :disabled="!editing"
                          class="flex-1 bg-transparent px-2 text-[12.5px] outline-none disabled:pointer-events-none">
                    <option value=""></option>
                    <option v-for="o in f.options" :key="o">{{ o }}</option>
                  </select>
                  <input v-else :type="f.type || 'text'" v-model.trim="form[f.key]" :readonly="!editing || (f.key==='empNo' && !isNew)"
                         :placeholder="f.placeholder || ''"
                         class="flex-1 min-w-0 bg-transparent px-2 text-[12.5px] outline-none"
                         :class="f.mono ? 'font-mono' : ''">
                </div>
              </div>
            </template>
          </div>
          <div class="grid grid-cols-1 border-t-0 border-l border-slate-300">
            <div class="flex border-r border-b border-slate-300 min-h-[30px]">
              <label class="flex-none w-[92px] flex items-center justify-center bg-slate-50 text-steel-dark text-[11px] font-bold px-2">個人聯絡地址</label>
              <input v-model.trim="form.address" :readonly="!editing"
                     class="flex-1 min-w-0 bg-transparent px-2 text-[12.5px] outline-none">
            </div>
          </div>
        </section>

        <!-- SEC.02 學歷 -->
        <section>
          <div class="flex items-center gap-2">
            <span class="font-mono text-[9px] text-copper tracking-wide">SEC.02</span>
            <h2 class="text-[13px] font-black tracking-[.25em] text-steel-dark">學歷</h2>
            <div class="flex-1 h-px bg-gradient-to-r from-steel via-slate-200 to-transparent"></div>
          </div>
          <table class="mt-1.5 w-full border-collapse">
            <colgroup><col class="w-20"><col><col class="w-[32%]"><col class="w-[26%]"></colgroup>
            <thead>
              <tr class="bg-slate-50 text-steel-dark text-[12px] font-bold tracking-wider">
                <th class="border border-slate-300 h-7 px-2">學歷</th>
                <th class="border border-slate-300 h-7 px-2">學校名稱</th>
                <th class="border border-slate-300 h-7 px-2">研讀科系</th>
                <th class="border border-slate-300 h-7 px-2">畢業期間</th>
              </tr>
            </thead>
            <tbody class="text-[12.5px]">
              <tr>
                <td class="border border-slate-300 bg-slate-50 text-center font-bold text-steel-dark tracking-[.2em]">最高</td>
                <td class="border border-slate-300"><input v-model.trim="form.eduTop.school" :readonly="!editing" class="w-full bg-transparent px-2 py-1.5 outline-none"></td>
                <td class="border border-slate-300"><input v-model.trim="form.eduTop.major" :readonly="!editing" class="w-full bg-transparent px-2 py-1.5 outline-none"></td>
                <td class="border border-slate-300"><input v-model.trim="form.eduTop.period" :readonly="!editing" placeholder="2015/09 - 2019/06" class="w-full bg-transparent px-2 py-1.5 outline-none font-mono"></td>
              </tr>
              <tr>
                <td class="border border-slate-300 bg-slate-50 text-center font-bold text-steel-dark tracking-[.2em]">次高</td>
                <td class="border border-slate-300"><input v-model.trim="form.eduSecond.school" :readonly="!editing" class="w-full bg-transparent px-2 py-1.5 outline-none"></td>
                <td class="border border-slate-300"><input v-model.trim="form.eduSecond.major" :readonly="!editing" class="w-full bg-transparent px-2 py-1.5 outline-none"></td>
                <td class="border border-slate-300"><input v-model.trim="form.eduSecond.period" :readonly="!editing" class="w-full bg-transparent px-2 py-1.5 outline-none font-mono"></td>
              </tr>
            </tbody>
          </table>
        </section>

        <!-- SEC.03 經歷 -->
        <section>
          <div class="flex items-center gap-2">
            <span class="font-mono text-[9px] text-copper tracking-wide">SEC.03</span>
            <h2 class="text-[13px] font-black tracking-[.25em] text-steel-dark">經歷</h2>
            <div class="flex-1 h-px bg-gradient-to-r from-steel via-slate-200 to-transparent"></div>
          </div>
          <table class="mt-1.5 w-full border-collapse">
            <colgroup><col><col class="w-[34%]"><col class="w-[22%]"><col v-if="editing" class="w-9"></colgroup>
            <thead>
              <tr class="bg-slate-50 text-steel-dark text-[12px] font-bold tracking-wider">
                <th class="border border-slate-300 h-7 px-2">公司名稱</th>
                <th class="border border-slate-300 h-7 px-2">擔任職務名稱</th>
                <th class="border border-slate-300 h-7 px-2">資歷</th>
                <th v-if="editing" class="border border-slate-300 h-7 px-2 print:hidden">刪</th>
              </tr>
            </thead>
            <tbody class="text-[12.5px]">
              <tr v-for="(exp, i) in form.experiences" :key="i">
                <td class="border border-slate-300"><input v-model.trim="exp.company" :readonly="!editing" class="w-full bg-transparent px-2 py-1.5 outline-none"></td>
                <td class="border border-slate-300"><input v-model.trim="exp.position" :readonly="!editing" class="w-full bg-transparent px-2 py-1.5 outline-none"></td>
                <td class="border border-slate-300"><input v-model.trim="exp.years" :readonly="!editing" placeholder="如 3 年 2 個月" class="w-full bg-transparent px-2 py-1.5 outline-none"></td>
                <td v-if="editing" class="border border-slate-300 text-center bg-slate-50 print:hidden">
                  <button @click="removeExp(i)" class="text-red-500 font-bold text-sm">✕</button>
                </td>
              </tr>
            </tbody>
          </table>
          <button v-if="editing" @click="addExp"
                  class="mt-1.5 rounded border border-dashed border-slate-300 text-steel text-[11px] px-4 py-1 hover:bg-slate-50 transition print:hidden">
            + 新增一筆經歷
          </button>
        </section>

        <!-- SEC.04 興趣・專長 -->
        <section>
          <div class="flex items-center gap-2">
            <span class="font-mono text-[9px] text-copper tracking-wide">SEC.04</span>
            <h2 class="text-[13px] font-black tracking-[.25em] text-steel-dark">興趣・專長</h2>
            <div class="flex-1 h-px bg-gradient-to-r from-steel via-slate-200 to-transparent"></div>
          </div>
          <div class="mt-1.5 grid grid-cols-1 sm:grid-cols-2 border-t border-l border-slate-300">
            <div class="flex border-r border-b border-slate-300 min-h-[52px]">
              <label class="flex-none w-[92px] flex items-center justify-center bg-slate-50 text-steel-dark text-[11px] font-bold px-2">興趣</label>
              <textarea v-model.trim="form.interests" :readonly="!editing" rows="2"
                        class="flex-1 min-w-0 bg-transparent px-2 py-1.5 text-[12.5px] outline-none resize-none leading-relaxed"></textarea>
            </div>
            <div class="flex border-r border-b border-slate-300 min-h-[52px]">
              <label class="flex-none w-[92px] flex items-center justify-center bg-slate-50 text-steel-dark text-[11px] font-bold px-2">專長</label>
              <textarea v-model.trim="form.skills" :readonly="!editing" rows="2"
                        class="flex-1 min-w-0 bg-transparent px-2 py-1.5 text-[12.5px] outline-none resize-none leading-relaxed"></textarea>
            </div>
          </div>
        </section>

        <!-- 頁尾 -->
        <footer class="mt-auto flex justify-between items-center border-t border-slate-300 pt-1.5 font-mono text-[9px] text-slate-500 tracking-wide">
          <span>FLIP CHIP CIM · PERSONNEL PROFILE · CONFIDENTIAL</span>
          <span>最後修改日 LAST MODIFIED:<b class="text-steel-dark">{{ form.lastModified || '—' }}</b></span>
        </footer>

      </div>
    </div>
  </div>
</script>

<script>
function emptyForm(){
  return {
    empNo:"", nameZh:"", title:"", nameEn:"",
    grade:"", gender:"", hireDate:"", blood:"",
    zodiac:"", emgName:"", birthDate:"", emgPhone:"",
    marriage:"", phone:"", mobile:"", address:"",
    eduTop:{school:"",major:"",period:""},
    eduSecond:{school:"",major:"",period:""},
    experiences:[{company:"",position:"",years:""}],
    interests:"", skills:"",
    photoUrl:"", lastModified:""
  };
}

/* 與 Flask 同源時打相對路徑;前端另外開時自動改連 localhost:5000 */
const API_BASE = location.port === "5000" ? "" : "http://localhost:5000";

const app = Vue.createApp({
  template: "#tpl-app",

  data(){
    return {
      view: "home",         // home | detail
      editing: false,
      isNew: false,
      list: [],
      keyword: "",
      page: 0,
      numColumns: 3,         // 目前顯示幾欄,依畫面寬度動態調整(1~3)
      rowsPerColumn: 8,      // 每欄可容納幾筆,依畫面高度動態計算
      form: emptyForm(),
      localPhoto: "",
      message: "",
      isError: false,
      apiBase: API_BASE,
      zodiacs: ["牡羊座","金牛座","雙子座","巨蟹座","獅子座","處女座","天秤座","天蠍座","射手座","魔羯座","水瓶座","雙魚座"],
      basicFields: [
        { key:"empNo",  label:"工號",       mono:true, placeholder:"必填,如 FC12345" },
        { key:"nameZh", label:"中文姓名" },
        { key:"title",  label:"職稱" },
        { key:"nameEn", label:"英文姓名" },
        { key:"grade",  label:"職等" },
        { key:"gender", label:"性別", type:"select", options:["男","女","其他"] },
        { key:"hireDate", label:"到職日", type:"date", mono:true },
        { key:"blood",  label:"血型", type:"select", options:["A","B","O","AB"] },
        { key:"zodiac", label:"星座", type:"select" }, // options 由 mounted 填入 zodiacs
        { key:"emgName", label:"緊急聯絡人" },
        { key:"birthDate", label:"出生日期", type:"date", mono:true },
        { key:"emgPhone", label:"緊急連絡人電話", mono:true },
        { key:"marriage", label:"婚姻", type:"select", options:["未婚","已婚","其他"] },
        { key:"phone",  label:"個人連絡電話", mono:true },
        { key:"mobile", label:"個人行動電話", mono:true },
      ],
    };
  },

  computed: {
    photoSrc(){
      return this.localPhoto || (this.form.photoUrl ? this.apiBase + this.form.photoUrl : "");
    },
    filteredList(){
      const k = this.keyword.toLowerCase();
      if(!k) return this.list;
      return this.list.filter(p =>
        (p.empNo||"").toLowerCase().includes(k) ||
        (p.nameZh||"").includes(this.keyword) ||
        (p.nameEn||"").toLowerCase().includes(k) ||
        (p.title||"").includes(this.keyword) ||
        (p.mobile||"").includes(this.keyword) ||
        (p.phone||"").includes(this.keyword)
      );
    },
    perPage(){
      return Math.max(this.rowsPerColumn * this.numColumns, this.numColumns);
    },
    totalPages(){
      return Math.max(1, Math.ceil(this.filteredList.length / this.perPage));
    },
    currentPageItems(){
      const start = this.page * this.perPage;
      return this.filteredList.slice(start, start + this.perPage);
    },
    pagedColumns(){
      const items = this.currentPageItems;
      const per = this.rowsPerColumn;
      const cols = [];
      for(let i = 0; i < this.numColumns; i++){
        cols.push(items.slice(i * per, (i + 1) * per));
      }
      return cols;
    },
  },

  methods: {
    notify(text, err){
      this.message = text;
      this.isError = !!err;
      setTimeout(() => { if(this.message === text) this.message = ""; }, 4000);
    },

    async fetchList(){
      try{
        const res = await fetch(this.apiBase + "/api/profiles");
        const j = await res.json();
        if(j.ok) this.list = j.items;
      }catch{
        this.notify("無法連線後端 (請先啟動 app.py)", true);
      }
      this.$nextTick(this.measureCapacity);
    },

    /* 依「三欄容器」實際可用寬度動態算出能放幾欄,再依可視高度算出每欄能放幾筆;超過的資料一律交給分頁 */
    measureCapacity(){
      const el = this.$refs.colArea;
      if(!el) return;

      const gap = 20;              // 對應 gap-5
      const minColWidth = 320;     // 每欄最小可接受寬度,低於此寬度就減少欄數
      const width = el.clientWidth;
      let cols = Math.floor((width + gap) / (minColWidth + gap));
      if(!Number.isFinite(cols) || cols < 1) cols = 1;
      if(cols > 3) cols = 3;
      this.numColumns = cols;

      const available = el.clientHeight;    // 分頁列高度已由 flex 版面固定預留,這裡拿到的就是實際可用高度
      const headerRowH = 38;                // 欄位標題列高度
      const rowH = 42;                      // 每筆資料列高度
      let rows = Math.floor((available - headerRowH) / rowH);
      if(!Number.isFinite(rows) || rows < 3) rows = 3;
      this.rowsPerColumn = rows;
      if(this.page > this.totalPages - 1) this.page = Math.max(0, this.totalPages - 1);
    },

    prevPage(){
      if(this.page > 0) this.page--;
    },
    nextPage(){
      if(this.page < this.totalPages - 1) this.page++;
    },

    goHome(){
      this.view = "home";
      this.editing = false;
      this.isNew = false;
      this.localPhoto = "";
      this.fetchList();
    },

    async openPerson(empNo){
      try{
        const res = await fetch(this.apiBase + "/api/profile/" + encodeURIComponent(empNo));
        const j = await res.json();
        if(!j.ok){ this.notify(j.error || "讀取失敗", true); return; }
        const d = { ...emptyForm(), ...j.data };
        d.eduTop = { ...emptyForm().eduTop, ...(j.data.eduTop||{}) };
        d.eduSecond = { ...emptyForm().eduSecond, ...(j.data.eduSecond||{}) };
        if(!Array.isArray(d.experiences) || !d.experiences.length){
          d.experiences = [{company:"",position:"",years:""}];
        }
        this.form = d;
        this.localPhoto = "";
        this.isNew = false;
        this.editing = false;
        this.view = "detail";
        window.scrollTo(0,0);
      }catch{
        this.notify("無法連線後端", true);
      }
    },

    newPerson(){
      this.form = emptyForm();
      this.localPhoto = "";
      this.isNew = true;
      this.editing = true;
      this.view = "detail";
      window.scrollTo(0,0);
    },

    async finishEdit(){
      if(!this.form.empNo){ this.notify("請先填寫工號", true); return; }
      try{
        const res = await fetch(this.apiBase + "/api/profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(this.form),
        });
        const j = await res.json();
        if(j.ok){
          this.form.lastModified = j.lastModified;
          this.editing = false;
          this.isNew = false;
          this.notify("已儲存 ✓");
        }else{
          this.notify(j.error || "儲存失敗", true);
        }
      }catch{
        this.notify("無法連線後端 (請先啟動 app.py)", true);
      }
    },

    async onPhotoChange(e){
      const file = e.target.files[0];
      if(!file) return;
      this.localPhoto = URL.createObjectURL(file);
      const fd = new FormData();
      fd.append("photo", file);
      try{
        const res = await fetch(this.apiBase + "/api/upload", { method: "POST", body: fd });
        const j = await res.json();
        if(j.ok){ this.form.photoUrl = j.url; this.notify("照片已上傳"); }
        else this.notify(j.error || "照片上傳失敗", true);
      }catch{
        this.notify("無法連線後端,照片僅本機預覽", true);
      }
    },

    addExp(){
      this.form.experiences.push({company:"",position:"",years:""});
    },
    removeExp(i){
      if(this.form.experiences.length > 1) this.form.experiences.splice(i,1);
      else this.form.experiences[0] = {company:"",position:"",years:""};
    },
  },

  watch: {
    keyword(){ this.page = 0; },
  },

  mounted(){
    // 星座欄位使用共用選項清單
    this.basicFields.find(f => f.key === "zodiac").options = this.zodiacs;
    this.fetchList();

    let resizeTimer = null;
    this._onResize = () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => this.measureCapacity(), 150);
    };
    window.addEventListener("resize", this._onResize);
  },

  unmounted(){
    window.removeEventListener("resize", this._onResize);
  },
});

app.mount("#app");
</script>
</body>
</html>
